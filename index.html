<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kristian Pitshugin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="landing" class="is-loading">
  <div class="scroll-progress" aria-hidden="true">
    <span id="scroll-progress-bar"></span>
  </div>

  <main class="landing-shell landing-shell-refined">
    <section class="landing-hero card surface-hero" id="landing-stage">
      <div class="landing-copy">
        <p class="eyebrow skeleton-text skeleton-eyebrow" id="title">Loading title</p>
        <h1 id="name" class="skeleton-text skeleton-name">Loading name</h1>
        <p id="positioning" class="hero-positioning skeleton-text skeleton-summary">Loading positioning</p>
        <p class="lead skeleton-text skeleton-summary" id="summary">Loading summary</p>

        <div id="hero-actions" class="hero-actions" aria-label="Primary actions">
          <span class="skeleton-link" aria-hidden="true"></span>
          <span class="skeleton-link" aria-hidden="true"></span>
        </div>

        <div id="hero-highlights" class="hero-highlights" aria-label="Quick highlights">
          <span class="skeleton-chip" aria-hidden="true"></span>
          <span class="skeleton-chip" aria-hidden="true"></span>
          <span class="skeleton-chip" aria-hidden="true"></span>
          <span class="skeleton-chip" aria-hidden="true"></span>
        </div>

        <div id="contact" class="contact contact-grid">
          <span class="skeleton-chip" aria-hidden="true"></span>
          <span class="skeleton-chip" aria-hidden="true"></span>
          <span class="skeleton-chip" aria-hidden="true"></span>
          <span class="skeleton-chip" aria-hidden="true"></span>
        </div>
      </div>

      <div class="landing-visual">
        <div class="landing-visual-grid">
          <div id="profile-image-wrap" class="profile-card hero-profile-card media-loading">
            <div class="skeleton-avatar" aria-hidden="true"></div>
            <img id="profile-image" class="profile-image" alt="Kristian Pitshugin profile photo" hidden />
          </div>

          <figure id="hero-athletics-card" class="landing-support-card media-loading">
            <div class="skeleton-avatar" aria-hidden="true"></div>
            <img id="hero-athletics-image" alt="Athletics highlight photo" hidden />
            <figcaption>
              <span id="hero-athletics-label">European medalist</span>
              <strong id="hero-athletics-detail">Israel national team</strong>
            </figcaption>
          </figure>

          <figure id="hero-education-card" class="landing-support-card media-loading">
            <div class="skeleton-avatar" aria-hidden="true"></div>
            <img id="hero-education-image" alt="Education highlight photo" hidden />
            <figcaption>
              <span id="hero-education-label">UGA graduation</span>
              <strong id="hero-education-detail">B.S. Computer Science</strong>
            </figcaption>
          </figure>
        </div>
      </div>

      <button type="button" class="hero-scroll-cue" data-scroll-target="#about-section" aria-label="Scroll to the next section">
        <span>Explore the full story</span>
        <strong>Scroll</strong>
      </button>
    </section>

    <section class="card landing-about" id="about-section">
      <div class="section-heading about-heading">
        <p class="eyebrow" id="about-eyebrow">About</p>
        <h2 id="about-heading">Loading about heading</h2>
      </div>

      <div class="about-layout">
        <div class="about-intro-column">
          <p id="about-intro" class="about-lead">Loading about intro</p>
          <div id="about-stats" class="about-stats"></div>
        </div>
        <div id="about-notes" class="about-notes"></div>
      </div>
    </section>

    <section class="card nav-card landing-nav-card" id="chapters-section">
      <div class="section-heading">
        <p class="eyebrow">Explore</p>
        <h2>Choose a chapter</h2>
      </div>
      <div id="section-nav" class="button-grid landing-grid">
        <span class="nav-button skeleton-button" aria-hidden="true"></span>
        <span class="nav-button skeleton-button" aria-hidden="true"></span>
        <span class="nav-button skeleton-button" aria-hidden="true"></span>
        <span class="nav-button skeleton-button" aria-hidden="true"></span>
        <span class="nav-button skeleton-button" aria-hidden="true"></span>
        <span class="nav-button skeleton-button" aria-hidden="true"></span>
      </div>
    </section>

    <section class="card story-strip-card">
      <div class="section-heading">
        <p class="eyebrow">Visual Story</p>
        <h2>Some moments behind my achievements</h2>
      </div>

      <div class="marquee-stage">
        <button type="button" class="marquee-control marquee-control-side marquee-control-prev" data-direction="-1" aria-label="Scroll visual story backward">&larr;</button>
        <div class="story-strip-viewport" data-marquee-viewport>
          <div id="story-strip" class="story-strip-track" data-marquee-track>
            <figure class="story-strip-item">
              <button type="button" class="gallery-trigger story-strip-trigger">
                <img src="assets/athletics/athletics-01.jpeg" alt="Kristian Pitshugin holding a European Championships medal." loading="lazy" decoding="async" />
                <span class="gallery-zoom-badge">Open photo</span>
              </button>
            </figure>
            <figure class="story-strip-item">
              <button type="button" class="gallery-trigger story-strip-trigger">
                <img src="assets/athletics/athletics-03.jpeg" alt="Kristian Pitshugin smiling in the pool after a race." loading="lazy" decoding="async" />
                <span class="gallery-zoom-badge">Open photo</span>
              </button>
            </figure>
            <figure class="story-strip-item">
              <button type="button" class="gallery-trigger story-strip-trigger">
                <img src="assets/athletics/athletics-04.jpeg" alt="Kristian Pitshugin racing breaststroke in competition." loading="lazy" decoding="async" />
                <span class="gallery-zoom-badge">Open photo</span>
              </button>
            </figure>
            <figure class="story-strip-item">
              <button type="button" class="gallery-trigger story-strip-trigger">
                <img src="assets/athletics/athletics-05.jpeg" alt="Kristian Pitshugin powering through a breaststroke race." loading="lazy" decoding="async" />
                <span class="gallery-zoom-badge">Open photo</span>
              </button>
            </figure>
            <figure class="story-strip-item">
              <button type="button" class="gallery-trigger story-strip-trigger">
                <img src="assets/education/education-01.jpeg" alt="Kristian Pitshugin at graduation in cap and gown holding his diploma." loading="lazy" decoding="async" />
                <span class="gallery-zoom-badge">Open photo</span>
              </button>
            </figure>
            <figure class="story-strip-item">
              <button type="button" class="gallery-trigger story-strip-trigger">
                <img src="assets/education/education-02.jpeg" alt="Kristian Pitshugin at Sanford Stadium during graduation ceremonies." loading="lazy" decoding="async" />
                <span class="gallery-zoom-badge">Open photo</span>
              </button>
            </figure>
          </div>
        </div>
        <button type="button" class="marquee-control marquee-control-side marquee-control-next" data-direction="1" aria-label="Scroll visual story forward">&rarr;</button>
      </div>
    </section>

    <section id="related-links-panel" class="card related-card landing-links-card">
      <div class="section-heading compact-heading">
        <p class="eyebrow">Resources</p>
        <h2>Selected links</h2>
      </div>
      <div id="related-links" class="related-grid">
        <span class="related-link skeleton-link" aria-hidden="true"></span>
        <span class="related-link skeleton-link" aria-hidden="true"></span>
      </div>
    </section>
  </main>

  <script src="resume-content.js"></script>
  <script src="site.js"></script>
</body>
</html>
