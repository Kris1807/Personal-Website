<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kristian Pitshugin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="landing">
  <main class="landing-shell">
    <section class="landing-hero card surface-hero">
      <div class="landing-copy">
        <p class="eyebrow" id="title"></p>
        <h1 id="name"></h1>
        <p class="lead" id="summary"></p>
        <div id="contact" class="contact"></div>
      </div>

      <div class="landing-visual">
        <div id="profile-image-wrap" class="profile-card hero-profile-card">
          <img id="profile-image" class="profile-image" alt="Kristian Pitshugin profile photo" />
        </div>
      </div>
    </section>

    <section class="card nav-card">
      <div class="section-heading">
        <p class="eyebrow">Explore</p>
        <h2>Choose a section</h2>
        <p>Each page focuses on one part of the story, so the site stays easy to browse and never feels overloaded.</p>
      </div>
      <div id="section-nav" class="button-grid"></div>
    </section>

    <section id="related-links-panel" class="card related-card">
      <div class="section-heading compact-heading">
        <p class="eyebrow">Links</p>
        <h2>Related Links</h2>
      </div>
      <div id="related-links" class="related-grid"></div>
    </section>
  </main>

  <script src="resume-content.js"></script>
  <script src="site.js"></script>
</body>
</html>
